name: DevOps Starter CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  run-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6

      - name: Execute system check script on host
        run: ./scripts/system_check.sh

      - name: Build Docker image
        run: docker build -t devops-health-check .

      - name: Run container test
        run: docker run --rm devops-health-check
