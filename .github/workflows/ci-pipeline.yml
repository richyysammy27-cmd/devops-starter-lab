name: DevOps Starter CI/CD

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6

      - name: Run host environment script
        run: ./scripts/system_check.sh

      - name: Build API Docker image
        run: docker build -t devops-starter-api .

      - name: Start container and verify /health endpoint
        run: |
          docker run -d --name ci-api -p 8080:8080 devops-starter-api
          sleep 3
          curl --fail http://localhost:8080/health
          docker stop ci-api
          docker rm ci-api

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag devops-starter-api:latest "${IMAGE_NAME}:latest"
          docker tag devops-starter-api:latest "${IMAGE_NAME}:${{ github.sha }}"
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${{ github.sha }}"
